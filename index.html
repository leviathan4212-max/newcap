<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #f3e9e9;
    --card: rgba(255, 250, 250, 0.75);
    --card-solid: #fffaf8;
    --ink: #3a3035;
    --muted: #8a7a80;
    --line: #d8c4c8;
    --accent: #d46b7e;
    --shadow: 0 8px 24px rgba(90, 50, 60, 0.12);
    --yellow: #e6b422;
    --green: #79a66b;
    --purple: #9b6b9b;
    --red: #c94f4f;
    --white-border: #f2efed;
    --system-purple: #8b5cf6;
    --system-bg: #f5f0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    color: var(--ink);
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 8px;
  }
  #app {
    width: 100%;
    min-height: 540px;
    margin: 0 auto;
    background: rgba(255, 250, 250, 0.92);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* 世界状态栏 */
  #worldbar {
    padding: 10px 12px;
    background: rgba(40, 30, 36, 0.85);
    color: #f5eef0;
    font-size: 11.5px;
    letter-spacing: 0.3px;
    overflow: hidden;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #worldbar .track {
    display: inline-block;
    white-space: nowrap;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .world-item { margin-right: 18px; display: inline; }
  .world-label { opacity: 0.7; margin-right: 4px; }
  /* 主内容 */
  #main {
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 14px;
    flex: 1;
    min-height: 0;
  }
  /* 主角信息 */
  .player-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(80, 50, 60, 0.06);
    flex: 1;
    min-height: 0;
  }
  .player-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 12.5px;
  }
  .player-row .label { color: var(--muted); flex-shrink: 0; }
  .player-row .value { text-align: right; }
  /* 入口按钮行 */
  #entries {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    margin-top: auto;
  }
  .entry-icon {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    cursor: pointer;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(50, 30, 40, 0.18);
    transition: all 0.2s;
    border: 2px solid rgba(255,255,255,0.5);
    text-align: center;
  }
  .entry-icon:hover {
    filter: brightness(1.08);
    box-shadow: 0 6px 16px rgba(50, 30, 40, 0.24);
  }
  #entry-characters { background: linear-gradient(135deg, #c77b8f, #9f5870); }
  #entry-locations { background: linear-gradient(135deg, #84a6b5, #5d8290); }
  #entry-backpack { background: linear-gradient(135deg, #b8a07e, #8f7758); }
  #entry-system { background: linear-gradient(135deg, #a78bfa, #7c5cc4); }
  /* 弹窗遮罩 */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(45, 28, 36, 0.5);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  /* 通用弹窗 */
  .modal {
    background: var(--card-solid);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(40, 20, 30, 0.3);
    width: 92%;
    max-width: 520px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 700;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .close-btn {
    cursor: pointer;
    font-size: 18px;
    color: var(--muted);
    background: none;
    border: none;
  }
  .close-btn:hover { color: var(--accent); }
  /* 列表 */
  .grid-list {
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    overflow-y: auto;
  }
  .char-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-radius: 12px;
    background: #faf1f0;
    border: 2px solid var(--white-border);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 6px rgba(80, 50, 60, 0.08);
  }
  .char-card:hover { transform: translateY(-2px); }
  .char-avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #dcc7cb;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    overflow: hidden;
  }
  .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .char-name { font-weight: 600; font-size: 13px; }
  /* 流光边框 */
  @keyframes borderFlow {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
    100% { filter: brightness(1); }
  }
  .stage-1 { border-color: #f2efed; }
  .stage-2 { border-color: #79a66b; animation: borderFlow 2.8s ease-in-out infinite; }
  .stage-3 { border-color: #e6b422; animation: borderFlow 2.2s ease-in-out infinite; }
  .stage-4 { border-color: #9b6b9b; animation: borderFlow 1.9s ease-in-out infinite; }
  .stage-5 { border-color: #c94f4f; animation: borderFlow 1.6s ease-in-out infinite; }
  /* 角色详情 */
  .char-detail {
    display: flex;
    padding: 14px;
    gap: 14px;
    overflow-y: auto;
    flex: 1;
  }
  .detail-left {
    width: 130px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .detail-avatar {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    background: #dcc7cb;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #fff;
    font-weight: 700;
    box-shadow: var(--shadow);
  }
  .detail-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .basic-info {
    margin-top: 8px;
    width: 100%;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .basic-info .name {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .basic-info .bio-line { margin-bottom: 2px; }
  .detail-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .value-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    font-size: 11px;
  }
  .value-row .label { width: 38px; color: var(--muted); flex-shrink: 0; }
  .value-bar {
    flex: 1;
    height: 7px;
    border-radius: 3px;
    background: #efe1e4;
    overflow: hidden;
  }
  .value-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .value-num { width: 28px; text-align: right; font-weight: 600; font-size: 11px; }
  .fill-favor { background: linear-gradient(90deg, #f2a2b8, #e86d8a); }
  .fill-arousal { background: linear-gradient(90deg, #a6c8d9, #6da0bd); }
  .fill-degrad { background: linear-gradient(90deg, #c99fc9, #8f5f8f); }
  .tabs { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .tab {
    padding: 4px 9px;
    background: #f3e2e4;
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
    color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab-content {
    flex: 1;
    overflow-y: auto;
    margin-top: 6px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.55;
    min-height: 60px;
  }
  .detail-block { margin-bottom: 8px; }
  .detail-block h4 {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .record-row {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 1px 0;
  }
  .record-row .k { color: var(--muted); }
  .record-row .v { text-align: right; }
  /* 地点详情草稿纸 */
  .draft-paper {
    margin: 12px;
    padding: 16px 14px;
    background: #faf5e8;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(70, 50, 30, 0.12);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 24px,
      #b3a68d 24px,
      #b3a68d 25px
    );
    line-height: 25px;
    overflow-y: auto;
    color: #4a4038;
    font-size: 12px;
    flex: 1;
  }
  .draft-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .draft-status { color: #7a6a58; margin-bottom: 6px; }
  .draft-desc { white-space: pre-wrap; margin-bottom: 10px; }
  .draft-characters { display: flex; flex-wrap: wrap; gap: 8px; }
  .mini-char {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.7);
    padding: 3px 7px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
  }
  .mini-avatar {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: #dcc7cb;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* 背包 */
  .item-list { padding: 12px; overflow-y: auto; }
  .item-row {
    background: #faf1f0;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .item-name { font-weight: 600; font-size: 12px; }
  .item-desc { font-size: 11px; color: var(--muted); }
  /* 系统面板 */
  .system-points {
    padding: 10px 14px;
    background: linear-gradient(135deg, #ede4ff, #f5ecff);
    border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .system-points .label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .system-points .value {
    font-weight: 700;
    color: var(--system-purple);
    font-size: 16px;
    font-family: 'Consolas', monospace;
  }
  .system-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(245, 240, 255, 0.5);
    flex-shrink: 0;
  }
  .sys-tab {
    flex: 1;
    padding: 6px 0;
    text-align: center;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    transition: all 0.2s;
  }
  .sys-tab.active {
    background: var(--system-purple);
    color: #fff;
    box-shadow: 0 2px 8px rgba(139, 92, 246, 0.35);
  }
  .sys-tab:hover:not(.active) {
    background: rgba(139, 92, 246, 0.1);
    color: var(--system-purple);
  }
  .system-content {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: rgba(255, 255, 255, 0.5);
  }
  .sys-pane { display: none; }
  .sys-pane.active { display: block; }
  /* 任务卡片 */
  .quest-card {
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
    border-left: 4px solid var(--muted);
    box-shadow: 0 2px 6px rgba(80, 50, 60, 0.06);
  }
  .quest-card.main {
    background: linear-gradient(135deg, #f5ecff, #ede4ff);
    border-left-color: var(--system-purple);
    box-shadow: 0 3px 10px rgba(139, 92, 246, 0.15);
  }
  .quest-card.side {
    background: linear-gradient(135deg, #ecf5fa, #e0eff7);
    border-left-color: #5d8290;
  }
  .quest-card.scene {
    background: linear-gradient(135deg, #f0faf0, #e4f5e4);
    border-left-color: #6b9b6b;
  }
  .quest-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    gap: 8px;
  }
  .quest-name {
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .quest-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(0,0,0,0.08);
    color: var(--muted);
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .quest-badge.e { background: #e8f5e8; color: #4a8a4a; }
  .quest-badge.d { background: #e8f0f5; color: #4a728a; }
  .quest-badge.c { background: #f5f0e8; color: #8a7a4a; }
  .quest-badge.b { background: #f5e8f0; color: #8a4a72; }
  .quest-badge.a { background: #f5e8e8; color: #8a4a4a; }
  .quest-badge.s { background: #2d2d3d; color: #ffd700; }
  .quest-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 1px 0;
    font-size: 11px;
    line-height: 1.55;
  }
  .quest-row .k { color: var(--muted); flex-shrink: 0; }
  .quest-row .v { text-align: left; flex: 1; min-width: 0; word-break: break-word; }
  .quest-row .v.left { text-align: left; }
  .quest-section-title {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 6px 2px 4px;
    margin-top: 4px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 8px;
  }
  /* 能力卡片 */
  .ability-card {
    background: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 4px solid #7c3aed;
    box-shadow: 0 2px 6px rgba(80, 50, 60, 0.06);
  }
  .ability-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    gap: 8px;
  }
  .ability-name {
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink);
  }
  .ability-level {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: linear-gradient(135deg, #a78bfa, #7c5cc4);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .ability-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 4px;
  }
  .ability-cd {
    font-size: 10.5px;
    color: #7c5cc4;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ability-cd::before {
    content: '⏱';
    font-size: 11px;
  }
  /* 商城商品卡片 */
  .item-shop-card {
    background: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(80, 50, 60, 0.06);
    border-left: 4px solid #9b6b9b;
  }
  .item-shop-card.ability { border-left-color: #7c3aed; background: linear-gradient(135deg,#faf5ff,#f3eaff); }
  .item-shop-card.ability-upgrade { border-left-color: #9333ea; background: linear-gradient(135deg,#f3e8ff,#e9d5ff); }
  .item-shop-card.system-item { border-left-color: #5d8290; background: linear-gradient(135deg,#ecf5fa,#e0eff7); }
  .item-shop-card.mystery-item { border-left-color: #b91c1c; background: linear-gradient(135deg,#fdf2f2,#fce4e4); }
  .item-shop-card.fun-item { border-left-color: #d97706; background: linear-gradient(135deg,#fffbeb,#fef3c7); }
  .item-shop-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 5px;
    gap: 8px;
  }
  .item-shop-name {
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }
  .item-shop-price {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--system-purple);
    font-family: 'Consolas', monospace;
    flex-shrink: 0;
  }
  .item-shop-cat {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 8px;
    background: rgba(0,0,0,0.07);
    color: var(--muted);
    margin-bottom: 4px;
  }
  .item-shop-desc {
    font-size: 11px;
    color: #5a5058;
    line-height: 1.55;
  }
  .empty-tip {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .scroll-area { scrollbar-width: thin; scrollbar-color: #d8c4c8 transparent; }
  .scroll-area::-webkit-scrollbar { width: 5px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #d8c4c8; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <!-- 世界状态栏 -->
  <div id="worldbar">
    <div class="track" id="worldbarTrack"></div>
  </div>

  <div id="main">
    <!-- 主角信息 -->
    <div class="player-card" id="playerCard"></div>

    <!-- 入口按钮 -->
    <div id="entries">
      <div class="entry-icon" id="entry-characters">角色</div>
      <div class="entry-icon" id="entry-locations">地点</div>
      <div class="entry-icon" id="entry-backpack">背包</div>
      <div class="entry-icon" id="entry-system">系统</div>
    </div>
  </div>

  <!-- 角色列表弹窗 -->
  <div class="mask" id="mask-char-list">
    <div class="modal">
      <div class="modal-head">角色列表 <button class="close-btn" data-close="mask-char-list">✕</button></div>
      <div class="grid-list scroll-area" id="char-list"></div>
    </div>
  </div>

  <!-- 角色详情弹窗 -->
  <div class="mask" id="mask-char-detail">
    <div class="modal" style="max-width:560px;">
      <div class="modal-head">角色详情 <button class="close-btn" data-close="mask-char-detail">✕</button></div>
      <div class="char-detail scroll-area" id="char-detail-content"></div>
    </div>
  </div>

  <!-- 地点列表弹窗 -->
  <div class="mask" id="mask-loc-list">
    <div class="modal">
      <div class="modal-head">地点列表 <button class="close-btn" data-close="mask-loc-list">✕</button></div>
      <div class="grid-list scroll-area" id="loc-list"></div>
    </div>
  </div>

  <!-- 地点详情弹窗 -->
  <div class="mask" id="mask-loc-detail">
    <div class="modal" style="max-width:500px;">
      <div class="modal-head">地点详情 <button class="close-btn" data-close="mask-loc-detail">✕</button></div>
      <div class="draft-paper scroll-area" id="loc-detail-content"></div>
    </div>
  </div>

  <!-- 背包弹窗 -->
  <div class="mask" id="mask-backpack">
    <div class="modal" style="max-width:400px;">
      <div class="modal-head">持有物品 <button class="close-btn" data-close="mask-backpack">✕</button></div>
      <div class="item-list scroll-area" id="backpack-list"></div>
    </div>
  </div>

  <!-- 系统弹窗 -->
  <div class="mask" id="mask-system">
    <div class="modal" style="max-width:560px;">
      <div class="modal-head" style="background:linear-gradient(135deg,#f5ecff,#ede4ff);">
        欲望系统
        <button class="close-btn" data-close="mask-system">✕</button>
      </div>
      <!-- 系统点数 -->
      <div class="system-points">
        <span class="label">系统点数</span>
        <span class="value" id="sys-points">0</span>
      </div>
      <!-- 系统 tab -->
      <div class="system-tabs">
        <div class="sys-tab active" data-sys-tab="quest">任务</div>
        <div class="sys-tab" data-sys-tab="ability">能力</div>
        <div class="sys-tab" data-sys-tab="shop">商城</div>
      </div>
      <!-- 系统内容 -->
      <div class="system-content scroll-area">
        <div class="sys-pane active" id="sys-pane-quest"></div>
        <div class="sys-pane" id="sys-pane-ability"></div>
        <div class="sys-pane" id="sys-pane-shop"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // 获取 MVU 变量
  function getVariables() {
    try {
      const all = getAllVariables();
      if (all && all.stat_data) return all.stat_data;
      return all || {};
    } catch(e) {
      return {};
    }
  }

  function getVar(path, def) {
    try {
      const val = _.get(getVariables(), path, def);
      return val === undefined || val === null ? def : val;
    } catch(e) {
      return def;
    }
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getStage(deg) {
    if (deg <= 20) return 1;
    if (deg <= 40) return 2;
    if (deg <= 60) return 3;
    if (deg <= 80) return 4;
    return 5;
  }

  function stageClass(deg) {
    return 'stage-' + getStage(deg);
  }

  function difficultyClass(d) {
    const m = { 'E': 'e', 'D': 'd', 'C': 'c', 'B': 'b', 'A': 'a', 'S': 's' };
    return m[String(d || '').trim().toUpperCase()] || '';
  }

  // 渲染世界状态栏
  function renderWorldbar() {
    const month = getVar('世界.月', 4);
    const day = getVar('世界.日', 4);
    const weekday = getVar('世界.周几', '周一');
    const hour = getVar('世界.时', 8);
    const minute = getVar('世界.分', 0);
    const weather = getVar('世界.天气', '晴朗');
    const event = getVar('世界.当前事件', '');

    const parts = [];
    parts.push(`<span class="world-item"><span class="world-label">日期</span>${escapeHtml(month)}月${escapeHtml(day)}日 ${escapeHtml(weekday)}</span>`);
    parts.push(`<span class="world-item"><span class="world-label">时间</span>${escapeHtml(hour)}:${String(minute).padStart(2,'0')}</span>`);
    parts.push(`<span class="world-item"><span class="world-label">天气</span>${escapeHtml(weather)}</span>`);
    if (event) parts.push(`<span class="world-item"><span class="world-label">事件</span>${escapeHtml(event)}</span>`);

    const track = document.getElementById('worldbarTrack');
    track.innerHTML = parts.join('') + parts.join('');
    track.style.animation = 'none';
    requestAnimationFrame(() => {
      const bar = document.getElementById('worldbar');
      if (track.scrollWidth > bar.clientWidth) {
        track.style.animation = 'marquee ' + Math.max(10, track.scrollWidth / 50) + 's linear infinite';
      }
    });
  }

  // 渲染主角信息
  function renderPlayer() {
    const scene = getVar('主角信息.当前场景', '未知');
    const money = getVar('主角信息.资金', 0);
    const clothes = getVar('主角信息.当前穿着', '-');
    const state = getVar('主角信息.当前状态', '-');
    const action = getVar('主角信息.当前行为', '-');

    document.getElementById('playerCard').innerHTML = `
      <div class="player-row"><span class="label">场景</span><span class="value">${escapeHtml(scene)}</span></div>
      <div class="player-row"><span class="label">资金</span><span class="value">${Number(money).toLocaleString()}</span></div>
      <div class="player-row"><span class="label">穿着</span><span class="value">${escapeHtml(clothes)}</span></div>
      <div class="player-row"><span class="label">状态</span><span class="value">${escapeHtml(state)}</span></div>
      <div class="player-row"><span class="label">行为</span><span class="value">${escapeHtml(action)}</span></div>
    `;
  }

  // 渲染角色列表
  function renderCharList() {
    const container = document.getElementById('char-list');
    const chars = getVar('角色', {});
    const keys = Object.keys(chars);
    if (!keys.length) {
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#8a7a80;">暂无角色数据</div>';
      return;
    }
    container.innerHTML = '';
    keys.forEach(name => {
      const c = chars[name];
      const normal = c.普通 || {};
      const deg = Number(normal.堕落值 ?? 0);
      const card = document.createElement('div');
      card.className = 'char-card ' + stageClass(deg);
      card.innerHTML = `
        <div class="char-avatar">${escapeHtml((normal.姓名 || name).slice(0,1))}</div>
        <div class="char-name">${escapeHtml(normal.姓名 || name)}</div>
      `;
      card.addEventListener('click', () => openCharDetail(name));
      container.appendChild(card);
    });
  }

  // 打开角色详情
  function openCharDetail(name) {
    const chars = getVar('角色', {});
    const c = chars[name];
    if (!c) return;
    const normal = c.普通 || {};
    const nsfw = c.NSFW || {};
    const container = document.getElementById('char-detail-content');
    const deg = Number(normal.堕落值 ?? 0);
    const favor = Number(normal.好感度 ?? 0);
    const arousal = Number(normal.发情值 ?? 0);

    container.innerHTML = `
      <div class="detail-left">
        <div class="detail-avatar">${escapeHtml((normal.姓名||name).slice(0,1))}</div>
        <div class="basic-info">
          <div class="name">${escapeHtml(normal.姓名 || name)}</div>
          <div class="bio-line">${escapeHtml(normal.年龄 ?? '')}岁 · ${escapeHtml(normal.身份 || '')}</div>
          <div class="bio-line">关系：${escapeHtml(normal.与主角关系 || '')}</div>
          <div class="bio-line">位置：${escapeHtml(normal.当前位置 || '未知')}</div>
          <div class="bio-line">情绪：${escapeHtml(normal.当前情绪 || '平静')}</div>
        </div>
      </div>
      <div class="detail-right">
        <div class="value-row">
          <span class="label">好感</span>
          <div class="value-bar"><div class="value-fill fill-favor" style="width:${Math.max(0, Math.min(100, (favor+100)/2))}%"></div></div>
          <span class="value-num">${favor}</span>
        </div>
        <div class="value-row">
          <span class="label">发情</span>
          <div class="value-bar"><div class="value-fill fill-arousal" style="width:${Math.max(0, Math.min(100, arousal))}%"></div></div>
          <span class="value-num">${arousal}</span>
        </div>
        <div class="value-row">
          <span class="label">堕落</span>
          <div class="value-bar"><div class="value-fill fill-degrad" style="width:${Math.max(0, Math.min(100, deg))}%"></div></div>
          <span class="value-num">${deg}</span>
        </div>
        <div class="tabs" id="char-tabs">
          <span class="tab active" data-tab="status">当前状态</span>
          <span class="tab" data-tab="profile">档案信息</span>
          <span class="tab" data-tab="nsfw">NSFW</span>
        </div>
        <div class="tab-content scroll-area" id="char-tab-content"></div>
      </div>
    `;
    container.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderCharTab(tab.dataset.tab, normal, nsfw);
      });
    });
    renderCharTab('status', normal, nsfw);
    document.getElementById('mask-char-detail').classList.add('show');
  }

  function renderCharTab(tab, normal, nsfw) {
    const el = document.getElementById('char-tab-content');
    if (tab === 'status') {
      el.innerHTML = `
        <div class="detail-block"><h4>当前行为</h4><div>${escapeHtml(normal.当前行为 || '-')}</div></div>
        <div class="detail-block"><h4>当前状态</h4><div>${escapeHtml(normal.当前状态 || '-')}</div></div>
        <div class="detail-block"><h4>内心想法</h4><div>${escapeHtml(normal.当前内心想法 || '-')}</div></div>
        <div class="detail-block"><h4>短期目标</h4><div>${escapeHtml(normal.短期目标 || '-')}</div></div>
        <div class="detail-block"><h4>长期目标</h4><div>${escapeHtml(normal.长期目标 || '-')}</div></div>
        <div class="detail-block"><h4>当前秘密</h4><div>${escapeHtml(normal.当前秘密 || '-')}</div></div>
      `;
    } else if (tab === 'profile') {
      const body = normal.身体信息 || {};
      const personalities = normal.性格 || {};
      const hobbies = normal.爱好 || {};
      const tags = normal.身份标签 || {};
      const known = normal.认识的人 || {};
      el.innerHTML = `
        <div class="detail-block"><h4>婚姻状态</h4><div>${escapeHtml(normal.婚姻状态 || '')}</div></div>
        <div class="detail-block"><h4>年龄</h4><div>${escapeHtml(normal.年龄 ?? '')}</div></div>
        <div class="detail-block"><h4>身份</h4><div>${escapeHtml(normal.身份 || '')}</div></div>
        <div class="detail-block"><h4>身体信息</h4>
          <div>身高：${escapeHtml(body.身高 ?? '')}cm 体重：${escapeHtml(body.体重 ?? '')}kg</div>
          <div>三围：${escapeHtml(body.三围 || '')} 体质：${escapeHtml(body.体质特征 || '')}</div>
        </div>
        <div class="detail-block"><h4>性格</h4>${Object.entries(personalities).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`).join('') || '-'}</div>
        <div class="detail-block"><h4>爱好</h4>${Object.entries(hobbies).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`).join('') || '-'}</div>
        <div class="detail-block"><h4>身份标签</h4>${Object.entries(tags).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`).join('') || '-'}</div>
        <div class="detail-block"><h4>认识的人</h4>${Object.entries(known).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`).join('') || '-'}</div>
      `;
    } else {
      const fetishes = nsfw.性癖 || {};
      const clothes = nsfw.服装状态 || {};
      const bodyParts = nsfw.身体部位物理状态 || {};
      const sens = nsfw.敏感点开发 || {};
      const period = nsfw.生理周期 || {};
      el.innerHTML = `
        <div class="detail-block"><h4>性经验</h4><div>${escapeHtml(nsfw.性经验 ?? 0)}</div></div>
        <div class="detail-block"><h4>初次对象</h4><div>${escapeHtml(nsfw.初次性爱对象 || '无')}</div></div>
        <div class="detail-block"><h4>最近对象</h4><div>${escapeHtml(nsfw.最近性爱对象 || '无')}</div></div>
        <div class="detail-block"><h4>最近时间/地点</h4><div>${escapeHtml(nsfw.最近性交时间 || '-')} / ${escapeHtml(nsfw.最近性交地点 || '-')}</div></div>
        <div class="detail-block"><h4>性癖开发值</h4><div>${escapeHtml(nsfw.性癖开发值 ?? 0)}</div></div>
        <div class="detail-block"><h4>性癖</h4>${Object.entries(fetishes).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)} Lv.${escapeHtml(v.等级 ?? 1)}</span><span class="v">${escapeHtml(v.细节描述 || '')}</span></div>`).join('') || '-'}</div>
        <div class="detail-block"><h4>隐藏性癖</h4><div>${escapeHtml(nsfw.隐藏性癖 || '')}</div></div>
        <div class="detail-block"><h4>服装状态</h4>
          ${['上装','下装','内衣','足部','腿部','饰品'].map(slot => {
            const items = clothes[slot] || {};
            return Object.entries(items).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v.状态)}</span></div>`).join('');
          }).join('') || '-'}
        </div>
        <div class="detail-block"><h4>身体部位</h4>
          ${Object.entries(bodyParts).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v.当前状态 || v.外观描述 || '')}</span></div>`).join('') || '-'}
        </div>
        <div class="detail-block"><h4>敏感点</h4>
          ${Object.entries(sens).map(([k,v]) => `<div class="record-row"><span class="k">${escapeHtml(k)} Lv.${escapeHtml(v.敏感等级 ?? 1)}</span><span class="v">${escapeHtml(v.生理反应 || '')}</span></div>`).join('') || '-'}
        </div>
        <div class="detail-block"><h4>生理周期</h4><div>安全期剩${escapeHtml(period.安全期剩余天数 ?? 21)}天 排卵期剩${escapeHtml(period.排卵期剩余天数 ?? 0)}天</div></div>
      `;
    }
  }

  // 渲染地点列表
  function renderLocList() {
    const container = document.getElementById('loc-list');
    const locs = getVar('地点', {});
    const keys = Object.keys(locs);
    if (!keys.length) {
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#8a7a80;">暂无地点数据</div>';
      return;
    }
    container.innerHTML = '';
    keys.forEach(name => {
      const card = document.createElement('div');
      card.className = 'char-card stage-1';
      card.innerHTML = `
        <div class="char-avatar">${escapeHtml(name.slice(0,1))}</div>
        <div class="char-name">${escapeHtml(name)}</div>
      `;
      card.addEventListener('click', () => openLocDetail(name));
      container.appendChild(card);
    });
  }

  function openLocDetail(name) {
    const locs = getVar('地点', {});
    const loc = locs[name];
    if (!loc) return;
    const chars = getVar('角色', {});
    const inChars = loc.在场角色 || [];
    const container = document.getElementById('loc-detail-content');
    container.innerHTML = `
      <div class="draft-title">${escapeHtml(name)}</div>
      <div class="draft-status">当前状态：${escapeHtml(loc.当前状态 || '正常')}</div>
      <div class="draft-desc">${escapeHtml(loc.描述 || '')}</div>
      <div><strong>在场角色</strong></div>
      <div class="draft-characters">
        ${inChars.map(cname => {
          const c = chars[cname];
          const displayName = c ? (c.普通?.姓名 || cname) : cname;
          return `<div class="mini-char" data-char="${escapeHtml(cname)}">
            <div class="mini-avatar">${escapeHtml(displayName.slice(0,1))}</div>
            <span>${escapeHtml(displayName)}</span>
          </div>`;
        }).join('') || '无'}
      </div>
    `;
    container.querySelectorAll('.mini-char').forEach(el => {
      el.addEventListener('click', () => {
        const cname = el.dataset.char;
        document.getElementById('mask-loc-detail').classList.remove('show');
        openCharDetail(cname);
      });
    });
    document.getElementById('mask-loc-detail').classList.add('show');
  }

  // 渲染背包
  function renderBackpack() {
    const container = document.getElementById('backpack-list');
    const items = getVar('主角信息.持有物品', {});
    const keys = Object.keys(items);
    if (!keys.length) {
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#8a7a80;">背包是空的</div>';
      return;
    }
    container.innerHTML = '';
    keys.forEach(key => {
      const item = items[key];
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `<div class="item-name">${escapeHtml(item.名称 || key)}</div><div class="item-desc">${escapeHtml(item.介绍 || '')}</div>`;
      container.appendChild(row);
    });
  }

  // ========== 系统面板渲染 ==========

  function renderSystem() {
    // 系统点数
    const points = getVar('系统.系统点数', 0);
    document.getElementById('sys-points').textContent = Number(points).toLocaleString();

    renderSysQuest();
    renderSysAbility();
    renderSysShop();
  }

  // 任务面板
  function renderSysQuest() {
    const pane = document.getElementById('sys-pane-quest');
    let html = '';

    // 主线任务
    const main = getVar('系统.主线任务', {});
    if (main && main.名称) {
      html += `<div class="quest-section-title">主线任务</div>`;
      html += `
        <div class="quest-card main">
          <div class="quest-head">
            <div class="quest-name">${escapeHtml(main.名称)}</div>
            <span class="quest-badge ${difficultyClass(main.难度)}">${escapeHtml(main.难度 || '?')}</span>
          </div>
          <div class="quest-row"><span class="k">目标</span><span class="v">${escapeHtml(main.目标 || '-')}</span></div>
          <div class="quest-row"><span class="k">阶段</span><span class="v">${escapeHtml(main.当前阶段 || '-')}</span></div>
          <div class="quest-row"><span class="k">阶段目标</span><span class="v">${escapeHtml(main.阶段目标 || '-')}</span></div>
          <div class="quest-row"><span class="k">进度</span><span class="v">${escapeHtml(main.进度 || '-')}</span></div>
          <div class="quest-row"><span class="k">奖励</span><span class="v">${escapeHtml(main.奖励 || '-')}</span></div>
          <div class="quest-row"><span class="k">惩罚</span><span class="v">${escapeHtml(main.惩罚 || '-')}</span></div>
        </div>
      `;
    }

    // 支线与情景任务
    const tasks = getVar('系统.任务', {});
    const taskKeys = Object.keys(tasks);
    const sideTasks = taskKeys.filter(k => (tasks[k].类型 || '') === '支线');
    const sceneTasks = taskKeys.filter(k => (tasks[k].类型 || '') === '情景');

    if (sideTasks.length) {
      html += `<div class="quest-section-title">支线任务</div>`;
      sideTasks.forEach(key => {
        const t = tasks[key];
        html += `
          <div class="quest-card side">
            <div class="quest-head">
              <div class="quest-name">${escapeHtml(key)}</div>
              <span class="quest-badge ${difficultyClass(t.难度)}">${escapeHtml(t.难度 || '?')}</span>
            </div>
            <div class="quest-row"><span class="k">目标</span><span class="v">${escapeHtml(t.目标 || '-')}</span></div>
            ${t.地点 ? `<div class="quest-row"><span class="k">地点</span><span class="v">${escapeHtml(t.地点)}</span></div>` : ''}
            <div class="quest-row"><span class="k">奖励</span><span class="v">${escapeHtml(t.奖励 ?? 0)} 点</span></div>
          </div>
        `;
      });
    }

    if (sceneTasks.length) {
      html += `<div class="quest-section-title">情景任务</div>`;
      sceneTasks.forEach(key => {
        const t = tasks[key];
        html += `
          <div class="quest-card scene">
            <div class="quest-head">
              <div class="quest-name">${escapeHtml(key)}</div>
              <span class="quest-badge ${difficultyClass(t.难度)}">${escapeHtml(t.难度 || '?')}</span>
            </div>
            <div class="quest-row"><span class="k">目标</span><span class="v">${escapeHtml(t.目标 || '-')}</span></div>
            ${t.地点 ? `<div class="quest-row"><span class="k">地点</span><span class="v">${escapeHtml(t.地点)}</span></div>` : ''}
            <div class="quest-row"><span class="k">奖励</span><span class="v">${escapeHtml(t.奖励 ?? 0)} 点</span></div>
          </div>
        `;
      });
    }

    if (!html) {
      html = '<div class="empty-tip">暂无任务</div>';
    }

    pane.innerHTML = html;
  }

  // 能力面板
  function renderSysAbility() {
    const pane = document.getElementById('sys-pane-ability');
    const abilities = getVar('系统.已拥有能力', {});
    const keys = Object.keys(abilities);
    if (!keys.length) {
      pane.innerHTML = '<div class="empty-tip">尚未拥有任何能力</div>';
      return;
    }
    let html = '';
    keys.forEach(name => {
      const a = abilities[name];
      html += `
        <div class="ability-card">
          <div class="ability-head">
            <div class="ability-name">${escapeHtml(name)}</div>
            <div class="ability-level">LV${escapeHtml(a.等级 ?? 1)}</div>
          </div>
          <div class="ability-desc">${escapeHtml(a.介绍 || '暂无介绍')}</div>
          <div class="ability-cd">冷却：${escapeHtml(a.剩余冷却时间 || '无')}</div>
        </div>
      `;
    });
    pane.innerHTML = html;
  }

  // 商城面板
  function renderSysShop() {
    const pane = document.getElementById('sys-pane-shop');
    const items = getVar('系统.商城商品', {});
    const keys = Object.keys(items);
    if (!keys.length) {
      pane.innerHTML = '<div class="empty-tip">商城尚未刷新</div>';
      return;
    }
    let html = '';
    keys.forEach(name => {
      const it = items[name];
      const cat = it.类别 || '';
      let catClass = '';
      if (cat === '能力') catClass = 'ability';
      else if (cat === '能力升级') catClass = 'ability-upgrade';
      else if (cat === '系统道具') catClass = 'system-item';
      else if (cat === '神秘道具') catClass = 'mystery-item';
      else if (cat === '趣味道具') catClass = 'fun-item';
      html += `
        <div class="item-shop-card ${catClass}">
          <div class="item-shop-head">
            <div class="item-shop-name">${escapeHtml(name)}</div>
            <div class="item-shop-price">${escapeHtml(it.价格 ?? 0)} 点</div>
          </div>
          ${cat ? `<div class="item-shop-cat">${escapeHtml(cat)}</div>` : ''}
          <div class="item-shop-desc">${escapeHtml(it.介绍 || '')}</div>
        </div>
      `;
    });
    pane.innerHTML = html;
  }

  // 系统 tab 切换
  function bindSystemTabs() {
    document.querySelectorAll('.sys-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sys-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sys-pane').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        const target = document.getElementById('sys-pane-' + tab.dataset.sysTab);
        if (target) target.classList.add('active');
      });
    });
  }

  // ========== 更新入口 ==========

  function updateUI() {
    renderWorldbar();
    renderPlayer();
    renderCharList();
    renderLocList();
    renderBackpack();
    renderSystem();
  }

  function bindEvents() {
    document.getElementById('entry-characters').addEventListener('click', () => {
      document.getElementById('mask-char-list').classList.add('show');
    });
    document.getElementById('entry-locations').addEventListener('click', () => {
      document.getElementById('mask-loc-list').classList.add('show');
    });
    document.getElementById('entry-backpack').addEventListener('click', () => {
      document.getElementById('mask-backpack').classList.add('show');
    });
    document.getElementById('entry-system').addEventListener('click', () => {
      document.getElementById('mask-system').classList.add('show');
    });
    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById(btn.dataset.close).classList.remove('show');
      });
    });
    document.querySelectorAll('.mask').forEach(mask => {
      mask.addEventListener('click', (e) => {
        if (e.target === mask) mask.classList.remove('show');
      });
    });
  }

  function init() {
    bindEvents();
    bindSystemTabs();
    updateUI();
    try {
      if (typeof eventOn === 'function' && window.Mvu && Mvu.events) {
        eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, updateUI);
      }
    } catch(e) {
      setInterval(updateUI, 2000);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
